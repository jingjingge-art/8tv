name: Update Kids IPTV

on:
  schedule:
    # 每天北京时间 10:00 (UTC 02:00) 自动更新一次
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动点击运行
  push:
    paths:
      - '.github/workflows/update-kids.yml' # 创建或修改此文件时自动触发测试

permissions:
  contents: write

jobs:
  fetch-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Fetch, speed-test, and export kids.txt
        run: |
          python3 - << 'EOF'
          import re
          import time
          import concurrent.futures
          import requests
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          SOURCE_URL = "https://raw.githubusercontent.com/iptv-org/iptv/refs/heads/gh-pages/languages/eng.m3u"
          OUTPUT_FILE = "kids.txt"
          TIMEOUT = 6       # 单个源测速超时时间（秒）
          MAX_WORKERS = 30  # 并发测速线程数

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          }

          def fetch_kids_channels():
              resp = requests.get(SOURCE_URL, headers=HEADERS, timeout=15)
              resp.raise_for_status()
              lines = [line.strip() for line in resp.text.splitlines() if line.strip()]

              channels = []
              seen_urls = set()
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith("#EXTINF:"):
                      group_match = re.search(r'group-title="([^"]*)"', line)
                      # iptv-org 中分组可能包含分号，例如 group-title="Animation;Kids"
                      groups = [g.strip().lower() for g in group_match.group(1).split(";")] if group_match else []
                      if "kids" in groups:
                          name = line.rsplit(",", 1)[-1].strip() if "," in line else "Unknown"
                          # 跳过可能存在的 #EXTVLCOPT / #KODIPROP 标签，找到实际播放地址
                          j = i + 1
                          while j < len(lines) and lines[j].startswith("#"):
                              j += 1
                          if j < len(lines) and lines[j].startswith(("http://", "https://")):
                              url = lines[j]
                              if url not in seen_urls:
                                  seen_urls.add(url)
                                  channels.append((name, url))
                              i = j
                  i += 1
              return channels

          def test_stream(item):
              name, url = item
              start = time.perf_counter()
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=TIMEOUT, stream=True, verify=False)
                  if resp.status_code in (200, 206):
                      # 读取首包数据验证流是否真正可用
                      chunk = next(resp.iter_content(chunk_size=512), b"")
                      resp.close()
                      if not chunk:
                          return None
                      # 过滤返回 200 但实际为网页报错的无效源
                      prefix = chunk.lstrip().lower()
                      if prefix.startswith((b"<!doctype", b"<html")):
                          return None
                      latency_ms = (time.perf_counter() - start) * 1000
                      return (latency_ms, name, url)
                  resp.close()
              except Exception:
                  pass
              return None

          def main():
              channels = fetch_kids_channels()
              print(f"共提取到 {len(channels)} 个 Kids 频道源，开始并发测速...")

              valid_channels = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
                  for result in executor.map(test_stream, channels):
                      if result is not None:
                          valid_channels.append(result)

              # 按响应延迟从低到高排序
              valid_channels.sort(key=lambda x: x[0])
              print(f"测速完成，有效可用源共 {len(valid_channels)} 个。")

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("Kids,#genre#\n")
                  for latency, name, url in valid_channels:
                      safe_name = name.replace(",", " ")
                      f.write(f"{safe_name},{url}\n")
                      print(f"[{latency:6.0f} ms] {safe_name}")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and push kids.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids.txt
          if git diff --staged --quiet; then
            echo "kids.txt 无变化，跳过提交。"
          else
            git commit -m "chore: update kids.txt sorted by latency"
            git push
          fi
