name: Scan 8TV playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-8tv
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan and validate streams
        env:
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN || github.token }}
        run: python scan_8tv.py

      - name: Commit playlist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 8tv.txt
          if git diff --cached --quiet; then
            echo "8tv.txt has not changed."
          else
            git commit -m "Update validated 8TV playlist"
            git push
          fi
